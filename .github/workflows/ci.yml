name: CI

# Credential-free by construction. This workflow contains zero `secrets.`
# references and uses only first-party GitHub actions (checkout, setup-node),
# so a fork PR gets exactly the same run as a branch PR. The build step below
# is not merely "does it compile" — it is the tested invariant that the app
# needs no secret at build time. Do not add a `secrets.` reference or an `env:`
# block of placeholder credentials to make a step pass: that would delete the
# invariant this workflow exists to protect.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded runs on the same ref are pointless spend — cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build / test / lint / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node version comes from the repo's own constraint: package.json
      # `engines.node` is ">=22" and .nvmrc pins 22 (Next.js 16 requires >=20.9,
      # so 22 clears it). Reading .nvmrc keeps CI from drifting away from local
      # and container builds. No dependency cache is configured on purpose — a
      # cold `npm ci` every run is the honest measure of the install budget.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # The manifest declares no install-lifecycle hooks (no prepare /
      # preinstall / postinstall), so `npm ci` runs no project code. If a hook
      # is ever added, remember it also fires on Vercel's install step.
      - name: Install
        run: npm ci

      # THE KEYLESS BUILD. No env is set here and no secret is available to the
      # job, so this step fails if anything reintroduces an import-time
      # credential requirement. The model client is a lazy factory
      # (src/lib/model-client.ts — `createModelClient()` reads
      # OPENROUTER_API_KEY at call time, never at module scope) and the DB
      # access is a lazy proxy, which is what makes a keyless build possible.
      # A failure here is a regression in that design, not a missing secret.
      - name: Build (keyless — no secrets available to this job)
        run: npm run build

      # Covers src/**/*.test.ts and scripts/**/*.test.mjs — including
      # scripts/preflight-env.test.mjs, which until now gated nothing.
      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # Runs after the build on purpose: tsconfig.json includes
      # .next/types/**/*.ts, which only exists once `next build` has emitted it.
      - name: Typecheck
        run: npm run typecheck

      # Compose environment coverage. The app service passes an explicit
      # `environment` map, so a variable absent from it never reaches the
      # container — silently, with nothing to debug against. This compares that
      # map against the app's own inventory (scripts/preflight-env.mjs
      # ENV_SPEC) and fails on a variable the app reads that compose cannot
      # deliver. Credential-free like every step here: it reads two checked-in
      # files and no environment. `npm test` above also gates it (the guard's
      # test file globs in), and the dedicated step is what makes the failure
      # legible in the log.
      - name: Compose env coverage
        run: npm run check:compose-env

      # ADR-0012 §3 / spec §8.3.3 parallel-serve: /.well-known/typed-publisher.json
      # (the canonical path) and /.well-known/evidence-public-keys.json (the
      # legacy path) MUST emit byte-identical content. The canonical path is a
      # force-static route handler that reads the legacy static file verbatim,
      # so the guarantee holds by construction — this step proves it against the
      # bytes the build actually emitted, and fails loudly if the route stops
      # being prerendered or starts re-serializing the JSON.
      - name: .well-known byte-identity
        run: |
          set -euo pipefail
          SOURCE="public/.well-known/evidence-public-keys.json"
          SERVED=".next/server/app/.well-known/typed-publisher.json.body"
          if [ ! -f "$SOURCE" ]; then
            echo "::error file=$SOURCE::legacy trust-registry file is missing"
            exit 1
          fi
          if [ ! -f "$SERVED" ]; then
            echo "::error::$SERVED was not emitted. /.well-known/typed-publisher.json is no longer prerendered as a static body (check \`export const dynamic = 'force-static'\` in src/app/.well-known/typed-publisher.json/route.ts). Byte-identity with the legacy path can no longer be proven at build time."
            exit 1
          fi
          if ! cmp "$SERVED" "$SOURCE"; then
            echo "::error::/.well-known/typed-publisher.json and /.well-known/evidence-public-keys.json are NOT byte-identical. ADR-0012 §3 requires the two paths emit the same bytes; verifiers that fetch either path must agree. Do not paper over this by regenerating one file."
            exit 1
          fi
          echo "byte-identical (sha256 $(sha256sum "$SOURCE" | cut -d' ' -f1))"

  # THE FILTERED-CONTEXT BUILD (#295). Every step in `verify` above runs on the
  # runner, where the whole repository is present. `docker build` does not: the
  # builder stage sees a `.dockerignore`-filtered context, and `next build`
  # type-checks whatever tsconfig.json's globs match *within that context*. The
  # two scopes can therefore disagree, and when they do, only the image build
  # notices — which is exactly what happened: a test file's import of a filtered
  # script broke the documented `docker compose up --build` bring-up for two
  # days while `verify` and `standalone.yml` stayed green on every PR.
  #
  # Running `npm run build:standalone` on the runner cannot see that class of
  # defect — standalone.yml's own header says so — because on the runner nothing
  # is filtered. Only a build whose context is actually filtered can. So this
  # job builds the real image, with the operator's own command shape.
  #
  # NO PATHS FILTER, deliberately. The trigger for this class is "any file the
  # build type-checks changed", which is most of the repository — a paths filter
  # would have to enumerate that, get it wrong, and go quiet. It lives in this
  # workflow rather than the paths-filtered standalone.yml for the same reason:
  # here, always-run is the file's existing property rather than a promise.
  #
  # Credential-free like the rest of this workflow: no `secrets.` and no `env:`.
  # The reference build passes NO `--build-arg` either, and that is part of the
  # same tested invariant — an operator's first build supplies no config.
  #
  # ONE EXCEPTION, and it is not configuration (#444). A second build passes
  # `--build-arg RUNTIME_BASE=runtime-without-docker-cli`, which selects which
  # runtime base stage the image is built from and nothing else. It carries no
  # value into the application, secret or otherwise; it exists so the variant
  # an operator without a container socket builds cannot rot untested. The
  # reference build above it still passes nothing, and
  # scripts/image-variant-and-readonly-root.test.mjs fails if either of those
  # two facts stops being true of this file.
  #
  # If anonymous Docker Hub pulls ever rate-limit this job, the seam is the
  # Dockerfile's NODE_IMAGE / DOCKER_CLI_IMAGE args, not a registry credential.
  container-image:
    name: container image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The default target (runner), not `--target builder`: it is what
      # `docker compose up --build` builds, and it additionally exercises the
      # standalone copy and the Dockerfile's sharp resolve-and-run smoke test,
      # neither of which any other job covers. The runtime stage costs little
      # on top of the builder stage — a cold `--no-cache` full build measured
      # 41s on one developer machine with the base images already local. That
      # is not a runner measurement; budget for the base-image pulls too.
      - name: Build the application image (dockerignore-filtered context)
        run: docker build --progress=plain -t civic-app:ci .

      # THE OFF VARIANT (#444) — the image an operator builds on a platform
      # with no container socket to hand over. The one `--build-arg` this job
      # passes, and the exception this job's header names.
      - name: Build the image without the docker CLI
        run: |
          # pipefail, or `tee` would swallow a failed build and the readings
          # below would run against a stale or absent image.
          set -eo pipefail
          docker build --progress=plain --build-arg RUNTIME_BASE=runtime-without-docker-cli -t civic-app:ci-no-docker-cli . 2>&1 | tee /tmp/off-variant-build.log

      # Three readings, because each can be true while another is false. The
      # stage graph is the one that matters — a variant that deleted the binary
      # in a later layer would still ship it in a lower one, and a `test ! -e`
      # inside the finished image cannot tell those apart.
      - name: The off variant builds no docker-cli stage and ships no docker binary
        run: |
          set -uo pipefail
          status=0

          # 1. THE STAGE GRAPH. BuildKit builds only the stages the target
          #    needs; a step line for the docker-cli stage in this log means
          #    the stage was in the graph after all.
          if grep -qE '\[docker-cli ' /tmp/off-variant-build.log; then
            echo "::error::the docker-cli stage was built for the off variant"
            grep -E '\[docker-cli ' /tmp/off-variant-build.log | head -5
            status=1
          else
            echo "OK — no docker-cli stage step in the off-variant build log"
          fi

          # 2. NO PULL of the CLI image, by the same log.
          if grep -qE 'load metadata for docker\.io/library/docker:|FROM docker\.io/library/docker:' /tmp/off-variant-build.log; then
            echo "::error::the off-variant build resolved or pulled the docker CLI image"
            grep -E 'docker\.io/library/docker:' /tmp/off-variant-build.log | head -5
            status=1
          else
            echo "OK — the off-variant build never resolved the docker CLI image"
          fi

          # 3. CORROBORATION, every layer of the finished image — not just the
          #    filesystem the last layer presents.
          rm -rf /tmp/off-image && mkdir -p /tmp/off-image
          docker save civic-app:ci-no-docker-cli -o /tmp/off-image.tar
          tar -xf /tmp/off-image.tar -C /tmp/off-image
          hits=0
          while IFS= read -r blob; do
            if tar -tf "$blob" 2>/dev/null | grep -qE '^usr/local/bin/docker$'; then
              echo "::error::/usr/local/bin/docker is present in layer $blob"
              hits=$((hits + 1))
            fi
          done < <(find /tmp/off-image -type f)
          if [ "$hits" -ne 0 ]; then status=1; else echo "OK — no layer of the off variant contains usr/local/bin/docker"; fi

          # And the plain filesystem reading, for completeness.
          if docker run --rm civic-app:ci-no-docker-cli sh -c 'test ! -e /usr/local/bin/docker'; then
            echo "OK — /usr/local/bin/docker does not exist in the off variant"
          else
            echo "::error::/usr/local/bin/docker exists in the off variant"
            status=1
          fi

          # The reference image is the control: the same three readings must
          # come out the other way, or the readings prove nothing.
          if docker run --rm civic-app:ci sh -c 'test -x /usr/local/bin/docker'; then
            echo "OK — the reference image still carries /usr/local/bin/docker"
          else
            echo "::error::the reference image lost /usr/local/bin/docker; the default is not unchanged"
            status=1
          fi
          exit $status

      - name: The off variant starts and serves the health route
        run: |
          set -uo pipefail
          docker run -d --name off-variant -p 3101:3000 civic-app:ci-no-docker-cli
          code=000
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3101/api/health || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          echo "off variant /api/health -> $code"
          if [ "$code" != "200" ]; then docker logs off-variant; docker rm -f off-variant; exit 1; fi
          docker rm -f off-variant

      # THE READ-ONLY ROOT (#469), driven on the built image on this runner and
      # driven BOTH ways. A demonstration that only ever supplies the mount is
      # a criterion shaped so it cannot fail: the run WITHOUT the mount is what
      # shows the documented path is the one that matters.
      #
      # WHAT THE WITHOUT-MOUNT RUN ACTUALLY DOES, measured rather than assumed:
      # it degrades, it does not break. The container starts, the health route
      # answers 200 and an optimised-image request STILL answers 200 — the
      # optimiser encodes and serves the image, then fails to store it. So the
      # falsifiable difference is the write, not the status code, and that is
      # what the two assertions below read. docs/deploy.md says the same thing
      # in the same words.
      - name: The runtime image under a read-only root filesystem
        run: |
          set -uo pipefail
          status=0
          WRITABLE=/app/.next/cache
          ASSET=$(docker run --rm civic-app:ci sh -c "find /app/public -name '*.png' | sort | head -1")
          IMGPATH=${ASSET#/app/public}
          echo "optimising $IMGPATH"

          # Both containers are started by a LITERAL docker run line, not from
          # a helper's "$@": scripts/image-variant-and-readonly-root.test.mjs
          # reads these two lines to check that the mount and the no-mount run
          # both exist, and it can only read what is written here.
          probe() {
            name=$1
            port=$2
            code=000
            for _ in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/api/health" || true)
              if [ "$code" = "200" ]; then break; fi
              sleep 1
            done
            echo "$name /api/health -> $code"
            if [ "$code" != "200" ]; then docker logs "$name"; return 1; fi
            img=$(curl -s -o /dev/null -w '%{http_code}' -G --data-urlencode "url=$IMGPATH" --data-urlencode "w=64" --data-urlencode "q=75" "http://127.0.0.1:$port/_next/image" || true)
            echo "$name /_next/image -> $img"
            if [ "$img" != "200" ]; then docker logs "$name"; return 1; fi
            return 0
          }

          # --- with the one documented mount ---
          docker run -d --name ro-with --read-only --tmpfs /app/.next/cache:rw,mode=1777 -p 3102:3000 civic-app:ci >/dev/null
          if ! probe ro-with 3102; then
            echo "::error::the read-only run WITH the documented mount did not serve"
            status=1
          fi
          cached=$(docker exec ro-with sh -c "find $WRITABLE -type f | wc -l" 2>/dev/null | tr -d '[:space:]')
          cached=${cached:-0}
          echo "with the mount: $cached file(s) under $WRITABLE"
          if [ "$cached" -lt 1 ]; then
            echo "::error::nothing was written under $WRITABLE, so the mount is present and useless"
            status=1
          fi
          # No write failure ANYWHERE. This is the assertion that would find a
          # SECOND writable path: one mount, and the log stays clean.
          if docker logs ro-with 2>&1 | grep -qiE "EROFS|read-only file system|Failed to write|unhandledRejection"; then
            echo "::error::a read-only container with the documented mount still failed a write — there is another writable path, and docs/deploy.md names only one"
            docker logs ro-with 2>&1 | grep -iE "EROFS|read-only file system|Failed to write|unhandledRejection" | head -10
            status=1
          else
            echo "OK — with $WRITABLE mounted, nothing else failed a write"
          fi

          # --- without it: the falsification ---
          docker run -d --name ro-without --read-only -p 3103:3000 civic-app:ci >/dev/null
          if ! probe ro-without 3103; then
            echo "note: without the mount the container did not serve; that is a stronger failure than the measured one"
          fi
          if docker logs ro-without 2>&1 | grep -q "$WRITABLE"; then
            echo "OK — without the mount, the container fails a write naming $WRITABLE:"
            docker logs ro-without 2>&1 | grep "$WRITABLE" | head -3
          else
            echo "::error::without the mount NOTHING failed a write at $WRITABLE — the documented path is not the one that matters; find the one that is"
            docker logs ro-without 2>&1 | tail -30
            status=1
          fi

          docker rm -f ro-with ro-without >/dev/null 2>&1 || true
          exit $status
