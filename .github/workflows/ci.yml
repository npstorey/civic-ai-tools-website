name: CI

# Credential-free by construction. This workflow contains zero `secrets.`
# references and uses only first-party GitHub actions (checkout, setup-node),
# so a fork PR gets exactly the same run as a branch PR. The build step below
# is not merely "does it compile" — it is the tested invariant that the app
# needs no secret at build time. Do not add a `secrets.` reference or an `env:`
# block of placeholder credentials to make a step pass: that would delete the
# invariant this workflow exists to protect.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded runs on the same ref are pointless spend — cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build / test / lint / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node version comes from the repo's own constraint: package.json
      # `engines.node` is ">=22" and .nvmrc pins 22 (Next.js 16 requires >=20.9,
      # so 22 clears it). Reading .nvmrc keeps CI from drifting away from local
      # and container builds. No dependency cache is configured on purpose — a
      # cold `npm ci` every run is the honest measure of the install budget.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # The manifest declares no install-lifecycle hooks (no prepare /
      # preinstall / postinstall), so `npm ci` runs no project code. If a hook
      # is ever added, remember it also fires on Vercel's install step.
      - name: Install
        run: npm ci

      # THE KEYLESS BUILD. No env is set here and no secret is available to the
      # job, so this step fails if anything reintroduces an import-time
      # credential requirement. The model client is a lazy factory
      # (src/lib/model-client.ts — `createModelClient()` reads
      # OPENROUTER_API_KEY at call time, never at module scope) and the DB
      # access is a lazy proxy, which is what makes a keyless build possible.
      # A failure here is a regression in that design, not a missing secret.
      - name: Build (keyless — no secrets available to this job)
        run: npm run build

      # Covers src/**/*.test.ts and scripts/**/*.test.mjs — including
      # scripts/preflight-env.test.mjs, which until now gated nothing.
      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # Runs after the build on purpose: tsconfig.json includes
      # .next/types/**/*.ts, which only exists once `next build` has emitted it.
      - name: Typecheck
        run: npm run typecheck

      # Compose environment coverage. The app service passes an explicit
      # `environment` map, so a variable absent from it never reaches the
      # container — silently, with nothing to debug against. This compares that
      # map against the app's own inventory (scripts/preflight-env.mjs
      # ENV_SPEC) and fails on a variable the app reads that compose cannot
      # deliver. Credential-free like every step here: it reads two checked-in
      # files and no environment. `npm test` above also gates it (the guard's
      # test file globs in), and the dedicated step is what makes the failure
      # legible in the log.
      - name: Compose env coverage
        run: npm run check:compose-env

      # ADR-0012 §3 / spec §8.3.3 parallel-serve: /.well-known/typed-publisher.json
      # (the canonical path) and /.well-known/evidence-public-keys.json (the
      # legacy path) MUST emit byte-identical content. The canonical path is a
      # force-static route handler that reads the legacy static file verbatim,
      # so the guarantee holds by construction — this step proves it against the
      # bytes the build actually emitted, and fails loudly if the route stops
      # being prerendered or starts re-serializing the JSON.
      - name: .well-known byte-identity
        run: |
          set -euo pipefail
          SOURCE="public/.well-known/evidence-public-keys.json"
          SERVED=".next/server/app/.well-known/typed-publisher.json.body"
          if [ ! -f "$SOURCE" ]; then
            echo "::error file=$SOURCE::legacy trust-registry file is missing"
            exit 1
          fi
          if [ ! -f "$SERVED" ]; then
            echo "::error::$SERVED was not emitted. /.well-known/typed-publisher.json is no longer prerendered as a static body (check \`export const dynamic = 'force-static'\` in src/app/.well-known/typed-publisher.json/route.ts). Byte-identity with the legacy path can no longer be proven at build time."
            exit 1
          fi
          if ! cmp "$SERVED" "$SOURCE"; then
            echo "::error::/.well-known/typed-publisher.json and /.well-known/evidence-public-keys.json are NOT byte-identical. ADR-0012 §3 requires the two paths emit the same bytes; verifiers that fetch either path must agree. Do not paper over this by regenerating one file."
            exit 1
          fi
          echo "byte-identical (sha256 $(sha256sum "$SOURCE" | cut -d' ' -f1))"

  # THE FILTERED-CONTEXT BUILD (#295). Every step in `verify` above runs on the
  # runner, where the whole repository is present. `docker build` does not: the
  # builder stage sees a `.dockerignore`-filtered context, and `next build`
  # type-checks whatever tsconfig.json's globs match *within that context*. The
  # two scopes can therefore disagree, and when they do, only the image build
  # notices — which is exactly what happened: a test file's import of a filtered
  # script broke the documented `docker compose up --build` bring-up for two
  # days while `verify` and `standalone.yml` stayed green on every PR.
  #
  # Running `npm run build:standalone` on the runner cannot see that class of
  # defect — standalone.yml's own header says so — because on the runner nothing
  # is filtered. Only a build whose context is actually filtered can. So this
  # job builds the real image, with the operator's own command shape.
  #
  # NO PATHS FILTER, deliberately. The trigger for this class is "any file the
  # build type-checks changed", which is most of the repository — a paths filter
  # would have to enumerate that, get it wrong, and go quiet. It lives in this
  # workflow rather than the paths-filtered standalone.yml for the same reason:
  # here, always-run is the file's existing property rather than a promise.
  #
  # Credential-free like the rest of this workflow: no `secrets.` and no `env:`.
  # The reference build passes NO `--build-arg` either, and that is part of the
  # same tested invariant — an operator's first build supplies no config.
  #
  # ONE EXCEPTION, and it is not configuration (#444). A second build passes
  # `--build-arg RUNTIME_BASE=runtime-without-docker-cli`, which selects which
  # runtime base stage the image is built from and nothing else. It carries no
  # value into the application, secret or otherwise; it exists so the variant
  # an operator without a container socket builds cannot rot untested. The
  # reference build above it still passes nothing, and
  # scripts/image-variant-and-readonly-root.test.mjs fails if either of those
  # two facts stops being true of this file.
  #
  # If anonymous Docker Hub pulls ever rate-limit this job, the seam is the
  # Dockerfile's NODE_IMAGE / DOCKER_CLI_IMAGE args, not a registry credential.
  container-image:
    name: container image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The default target (runner), not `--target builder`: it is what
      # `docker compose up --build` builds, and it additionally exercises the
      # standalone copy and the Dockerfile's sharp resolve-and-run smoke test,
      # neither of which any other job covers. The runtime stage costs little
      # on top of the builder stage — a cold `--no-cache` full build measured
      # 41s on one developer machine with the base images already local. That
      # is not a runner measurement; budget for the base-image pulls too.
      - name: Build the application image (dockerignore-filtered context)
        run: docker build --progress=plain -t civic-app:ci .

      # THE OFF VARIANT (#444) — the image an operator builds on a platform
      # with no container socket to hand over. The one `--build-arg` this job
      # passes, and the exception this job's header names.
      - name: Build the image without the docker CLI
        run: |
          # pipefail, or `tee` would swallow a failed build and the readings
          # below would run against a stale or absent image.
          set -eo pipefail
          docker build --progress=plain --build-arg RUNTIME_BASE=runtime-without-docker-cli -t civic-app:ci-no-docker-cli . 2>&1 | tee /tmp/off-variant-build.log

      # Three readings, because each can be true while another is false. The
      # stage graph is the one that matters — a variant that deleted the binary
      # in a later layer would still ship it in a lower one, and a `test ! -e`
      # inside the finished image cannot tell those apart.
      - name: The off variant builds no docker-cli stage and ships no docker binary
        run: |
          set -uo pipefail
          status=0

          # 1. THE STAGE GRAPH. BuildKit builds only the stages the target
          #    needs; a step line for the docker-cli stage in this log means
          #    the stage was in the graph after all.
          if grep -qE '\[docker-cli ' /tmp/off-variant-build.log; then
            echo "::error::the docker-cli stage was built for the off variant"
            grep -E '\[docker-cli ' /tmp/off-variant-build.log | head -5
            status=1
          else
            echo "OK — no docker-cli stage step in the off-variant build log"
          fi

          # 2. NO PULL of the CLI image, by the same log.
          if grep -qE 'load metadata for docker\.io/library/docker:|FROM docker\.io/library/docker:' /tmp/off-variant-build.log; then
            echo "::error::the off-variant build resolved or pulled the docker CLI image"
            grep -E 'docker\.io/library/docker:' /tmp/off-variant-build.log | head -5
            status=1
          else
            echo "OK — the off-variant build never resolved the docker CLI image"
          fi

          # 3. CORROBORATION, every layer of the finished image — not just the
          #    filesystem the last layer presents. The same scan runs on the
          #    reference image first, as its positive control: that image
          #    ships the binary, so the scan must find it there. A zero on the
          #    off variant counts only when the scan found it in the
          #    reference, because a changed `docker save` layout would read
          #    zero on both.
          docker_layer_hits() {
            local image="$1" dir="$2" hits=0 list
            rm -rf "$dir" && mkdir -p "$dir"
            docker save "$image" -o "$dir.tar"
            tar -xf "$dir.tar" -C "$dir"
            while IFS= read -r blob; do
              # The listing is read into a variable, then matched. Piped into
              # `grep -q` under pipefail, tar dies on its next write once grep
              # exits at the match, and a layer holding the binary reads as
              # one without it (#514). A blob that is not a tar fails the
              # listing and is skipped, as before.
              if list=$(tar -tf "$blob" 2>/dev/null) && grep -qE '^usr/local/bin/docker$' <<< "$list"; then
                echo "  $image: usr/local/bin/docker in ${blob#"$dir"/}" >&2
                hits=$((hits + 1))
              fi
            done < <(find "$dir" -type f)
            echo "$hits"
          }
          ref_hits=$(docker_layer_hits civic-app:ci /tmp/ref-image)
          off_hits=$(docker_layer_hits civic-app:ci-no-docker-cli /tmp/off-image)
          echo "layers containing usr/local/bin/docker — reference (civic-app:ci): $ref_hits; off variant (civic-app:ci-no-docker-cli): $off_hits"
          if [ "$ref_hits" -ge 1 ]; then
            echo "OK — the scan finds usr/local/bin/docker in the reference image's layers"
          else
            echo "::error::the layer scan found no usr/local/bin/docker in the reference image, which ships it; the scan cannot see the binary, so its zero on the off variant proves nothing"
            status=1
          fi
          if [ "$off_hits" -ne 0 ]; then
            echo "::error::/usr/local/bin/docker is present in $off_hits layer(s) of the off variant"
            status=1
          else
            echo "OK — no layer of the off variant contains usr/local/bin/docker"
          fi

          # And the plain filesystem reading, for completeness.
          if docker run --rm civic-app:ci-no-docker-cli sh -c 'test ! -e /usr/local/bin/docker'; then
            echo "OK — /usr/local/bin/docker does not exist in the off variant"
          else
            echo "::error::/usr/local/bin/docker exists in the off variant"
            status=1
          fi

          # The reference image is the control for this filesystem reading
          # too (the layer scan's control is above): the binary must be there.
          if docker run --rm civic-app:ci sh -c 'test -x /usr/local/bin/docker'; then
            echo "OK — the reference image still carries /usr/local/bin/docker"
          else
            echo "::error::the reference image lost /usr/local/bin/docker; the default is not unchanged"
            status=1
          fi
          exit $status

      - name: The off variant starts and serves the health route
        run: |
          set -uo pipefail
          docker run -d --name off-variant -p 3101:3000 civic-app:ci-no-docker-cli
          code=000
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3101/api/health || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          echo "off variant /api/health -> $code"
          if [ "$code" != "200" ]; then docker logs off-variant; docker rm -f off-variant; exit 1; fi
          docker rm -f off-variant

      # THE READ-ONLY ROOT (#469), driven on the built image on this runner and
      # driven BOTH ways. A demonstration that only ever supplies the mount is
      # a criterion shaped so it cannot fail: the run WITHOUT the mount is what
      # shows the documented path is the one that matters.
      #
      # WHAT THE WITHOUT-MOUNT RUN ACTUALLY DOES, measured rather than assumed:
      # it degrades, it does not break. The container starts, the health route
      # answers 200 and an optimised-image request STILL answers 200 — the
      # optimiser encodes and serves the image, then fails to store it. So the
      # falsifiable difference is the write, not the status code, and that is
      # what the two assertions below read. docs/deploy.md says the same thing
      # in the same words.
      #
      # HOW THE LOGS ARE READ (#508), also measured. Next.js awaits the
      # optimiser's cache write before it sends the image, so a refused write
      # is logged BEFORE the 200: dockerd stamps the line ahead of the
      # response. Two things can still hide a line that is there. Piped into
      # `grep -q` under pipefail, docker logs can die of SIGPIPE and turn a
      # match into a miss (see logged() below), so a log is read into a
      # variable instead. And docker's log pipeline can hold a written line
      # back from `docker logs` for a moment, so a line that must be PRESENT
      # is polled for: the poll stops the moment it arrives and fails if it
      # never does. The with-mount log must be CLEAN, and a wait on an
      # absence can never stop early, so that log is read only after two
      # things: the no-mount run, started after the with-mount run answered,
      # has shown its own refused write, so the with-mount run has had at
      # least that whole start-to-log interval; and a marker written into the
      # container's own stdout and stderr is readable. docker logs keeps each
      # stream in write order, so every earlier line is readable too, and a
      # log that shows no marker cannot see anything, so its silence proves
      # nothing. A write attempted later than the no-mount run's whole
      # start-to-log interval is outside what that read covers.
      # scripts/readonly-root-race/drive.sh drives this step against stubs
      # whose write lands before the response, after it, or never.
      - name: The runtime image under a read-only root filesystem
        run: |
          set -uo pipefail
          status=0
          WRITABLE=/app/.next/cache
          ASSET=$(docker run --rm civic-app:ci sh -c "find /app/public -name '*.png' | sort | head -1")
          IMGPATH=${ASSET#/app/public}
          echo "optimising $IMGPATH"

          # Wall-clock milliseconds, from bash's own clock.
          now_ms() { local us=${EPOCHREALTIME/[.,]/}; echo $((us / 1000)); }

          # Both containers are started by a LITERAL docker run line, not from
          # a helper's "$@": scripts/image-variant-and-readonly-root.test.mjs
          # reads these two lines to check that the mount and the no-mount run
          # both exist, and it can only read what is written here.
          probe() {
            name=$1
            port=$2
            code=000
            answered_ms=
            for _ in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/api/health" || true)
              if [ "$code" = "200" ]; then break; fi
              sleep 1
            done
            echo "$name /api/health -> $code"
            if [ "$code" != "200" ]; then docker logs "$name"; return 1; fi
            img=$(curl -s -o /dev/null -w '%{http_code}' -G --data-urlencode "url=$IMGPATH" --data-urlencode "w=64" --data-urlencode "q=75" "http://127.0.0.1:$port/_next/image" || true)
            answered_ms=$(now_ms)
            echo "$name /_next/image -> $img"
            if [ "$img" != "200" ]; then docker logs "$name"; return 1; fi
            return 0
          }

          # Re-runs a check every 100 ms until it passes, for at most $1
          # seconds. For a PRESENCE only.
          wait_for() {
            local deadline=$(( $(now_ms) + $1 * 1000 ))
            shift
            until "$@"; do
              if [ "$(now_ms)" -ge "$deadline" ]; then return 1; fi
              sleep 0.1
            done
          }
          # A log is read whole into $log and tested there, never piped into
          # `grep -q`: under pipefail that pipeline reads a PRESENT line as
          # absent whenever grep exits before docker logs has written
          # everything, because docker logs then dies of SIGPIPE (measured:
          # 61 of 200 reads of one unchanged log, #508).
          logged() { log=$(docker logs "$1" 2>&1) && [[ $log == *"$2"* ]]; }
          marked() { log=$(docker logs "$1" 2>&1) && [ "$(grep -cF -- "$2" <<< "$log")" -ge 2 ]; }
          cache_files() { docker exec ro-with sh -c "find $WRITABLE -type f | wc -l" 2>/dev/null | tr -d '[:space:]'; }
          has_cache_file() { [ "$(cache_files)" -ge 1 ] 2>/dev/null; }

          # --- with the one documented mount ---
          docker run -d --name ro-with --read-only --tmpfs /app/.next/cache:rw,mode=1777 -p 3102:3000 civic-app:ci >/dev/null
          if ! probe ro-with 3102; then
            echo "::error::the read-only run WITH the documented mount did not serve"
            status=1
          fi
          with_answered_ms=$answered_ms
          # Its cache and its log are read below, after the run without it.

          # --- without it: the falsification, and the control for that read ---
          docker run -d --name ro-without --read-only -p 3103:3000 civic-app:ci >/dev/null
          if ! probe ro-without 3103; then
            echo "note: without the mount the container did not serve; that is a stronger failure than the measured one"
          fi
          without_answered_ms=$answered_ms
          if wait_for 10 logged ro-without "$WRITABLE"; then
            readable_ms=$(now_ms)
            echo "OK — without the mount, the container fails a write naming $WRITABLE:"
            grep -m3 -F -- "$WRITABLE" <<< "$log"
            stamp=$(grep -m1 -F -- "$WRITABLE" <<< "$(docker logs -t ro-without 2>&1)" | cut -d' ' -f1 || true)
            stamped_ms=$( [ -n "$stamp" ] && date -d "$stamp" +%s%3N 2>/dev/null || true)
            if [ -n "$without_answered_ms" ] && [ -n "$stamped_ms" ]; then
              echo "latency, image response -> first line naming $WRITABLE: stamped by dockerd at $((stamped_ms - without_answered_ms)) ms, readable by docker logs at $((readable_ms - without_answered_ms)) ms (polled every 100 ms; negative is before curl had the response)"
            fi
          else
            echo "::error::without the mount NOTHING failed a write at $WRITABLE within 10 s — the documented path is not the one that matters; find the one that is"
            tail -n 30 <<< "$log"
            status=1
          fi

          # --- the with-mount reads, ordered after that control ---
          wait_for 10 has_cache_file || true
          cached=$(cache_files || true)
          cached=${cached:-0}
          echo "with the mount: $cached file(s) under $WRITABLE"
          if [ "$cached" -lt 1 ]; then
            echo "::error::nothing was written under $WRITABLE, so the mount is present and useless"
            status=1
          fi
          # No write failure ANYWHERE. This is the assertion that would find a
          # SECOND writable path: one mount, and the log stays clean. It reads
          # the log text in which the marker was seen.
          marker="log-marker-ro-with-$(now_ms)"
          if ! docker exec ro-with sh -c "echo $marker >/proc/1/fd/1; echo $marker >/proc/1/fd/2" || ! wait_for 10 marked ro-with "$marker"; then
            echo "::error::a marker written into ro-with's own stdout and stderr never reached docker logs, so a clean log would prove nothing"
            status=1
          elif grep -qiE "EROFS|read-only file system|Failed to write|unhandledRejection" <<< "$log"; then
            echo "::error::a read-only container with the documented mount still failed a write — there is another writable path, and docs/deploy.md names only one"
            grep -m10 -iE "EROFS|read-only file system|Failed to write|unhandledRejection" <<< "$log"
            status=1
          else
            echo "OK — with $WRITABLE mounted, nothing else failed a write${with_answered_ms:+ (log read $(( $(now_ms) - with_answered_ms )) ms after its image response)}"
          fi

          docker rm -f ro-with ro-without >/dev/null 2>&1 || true
          exit $status

  # THE EXECUTOR IMAGE (#490). docker/executor/Dockerfile builds the image the
  # `container` notebook-executor driver runs model-written code in. Until this
  # job, nothing built it in CI: src/lib/sandbox/executor-pins.test.ts and
  # container.test.ts read the Dockerfile's text, and a file can name the right
  # pins, a USER and a warm step in the right order and still build an image
  # that carries other versions, runs as root, or leaves the font cache cold.
  # This job builds the image and reads the image.
  #
  # Every step calls scripts/executor-image-check.mjs, which reads the expected
  # versions from the pin tables themselves (PINNED_LIBRARIES,
  # PYTHON_RUNTIME_VERSION, EXECUTOR_TOOLING_PACKAGES) and runs the same way
  # on a developer machine. Its header says what each check can fail on and
  # what it cannot see. The checks run whenever the build succeeded, each on
  # its own, so one red does not hide another.
  #
  # NO PATHS FILTER, deliberately, for the same reason as the job above: the
  # image depends on the pin tables in src/ as well as on docker/executor, and
  # on PyPI, which changes without a commit here.
  #
  # Credential-free like the rest of this workflow: no `secrets.`, no `env:`,
  # no registry login. The build downloads the base image from Docker Hub and
  # the pinned packages from PyPI anonymously, so an outage of either fails
  # this job the way an npm registry outage fails `npm ci` above. No `npm ci`
  # here: the check imports only the two pin tables, which need no dependency.
  #
  # REQUIRED: a required status check in ruleset 17585984 (`protect-main`),
  # added under #518 (ruling D4). The ruleset matches the name below, so a
  # rename leaves every pull request waiting on a check that never reports;
  # rename it only together with the ruleset entry.
  executor-image:
    name: executor image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Build the executor image
        id: build
        run: node --experimental-strip-types scripts/executor-image-check.mjs build

      - name: Every pinned version is the one pip freeze reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --experimental-strip-types scripts/executor-image-check.mjs pins

      - name: The pinned set is consistent and every pin imports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --experimental-strip-types scripts/executor-image-check.mjs imports

      - name: The default user is not root
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --experimental-strip-types scripts/executor-image-check.mjs user

      - name: The font cache is warm for that user
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --experimental-strip-types scripts/executor-image-check.mjs font-cache

      - name: The parity notebook executes through the container driver
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --experimental-strip-types scripts/executor-image-check.mjs parity

  # THE LAMBDA IMAGE (#530 P2). The `lambda` target of docker/executor/Dockerfile
  # is the function EXECUTOR_DRIVER=lambda invokes. This job builds it, checks
  # its pins and runs its handler's own tests inside it, then runs it under the
  # AWS Lambda Runtime Interface Emulator the way Lambda runs it: read-only root,
  # writable /tmp, a user of its own. Against that it drives the lambda driver:
  # the parity notebook, compared with the container driver's run (only
  # executor-parity.mjs's five masked fields may differ); isolation between runs
  # (ruling D3); the tokens and the function's log (D5); matplotlib under the
  # read-only root; and the size refusal (D2). scripts/lambda-image-check.mjs
  # says what each step can fail on, and each observation that could pass by
  # seeing nothing has a control there.
  #
  # NO PATHS FILTER, for the reason the two jobs above give: the image depends
  # on the pin tables in src/ and on PyPI, and the driver on src/.
  #
  # Credential-free like the rest of this workflow: no `secrets.`, no `env:`.
  # The driver reaches the emulator through a client that signs nothing
  # (scripts/lambda-emulator.mjs); the emulator binary is a GitHub release,
  # checked against a pinned SHA-256; the two tokens are decoys generated per
  # run. Unlike the executor job it runs `npm ci`: the lambda driver imports
  # the AWS SDK.
  #
  # NOT A REQUIRED CHECK YET. Adding it to ruleset 17585984 (`protect-main`) is
  # the owner's step; the name below is what that entry would match.
  lambda-image:
    name: lambda executor image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install
        run: npm ci

      - name: Build the lambda and container targets
        id: build
        run: node --experimental-strip-types scripts/lambda-image-check.mjs build

      - name: Every pin is the one pip freeze reports in the lambda image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --experimental-strip-types scripts/lambda-image-check.mjs pins

      - name: The handler's own tests pass inside the image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --experimental-strip-types scripts/lambda-image-check.mjs handler-tests

      - name: Start the runtime interface emulator
        id: start
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node --experimental-strip-types scripts/lambda-image-check.mjs start

      - name: The parity notebook matches the container driver's
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: node --experimental-strip-types scripts/lambda-image-check.mjs parity

      - name: What one run leaves, the next run cannot see
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: node --experimental-strip-types scripts/lambda-image-check.mjs isolation

      - name: The tokens come from the function, and its log carries none
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: node --experimental-strip-types scripts/lambda-image-check.mjs secrets

      - name: Matplotlib adds nothing to a notebook under the read-only root
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: node --experimental-strip-types scripts/lambda-image-check.mjs matplotlib

      - name: An executed notebook over the limit is refused by name
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: node --experimental-strip-types scripts/lambda-image-check.mjs size

      - name: Stop the emulator
        if: ${{ always() }}
        run: node --experimental-strip-types scripts/lambda-image-check.mjs stop
